/* =========================================================

function toggleTriagePanel() {
  const panel = document.getElementById("triagePanel");
  const arrow = document.getElementById("triageArrow");
  const status = document.getElementById("triageTabStatus");

  if (panel.classList.contains("hidden")) {
    panel.classList.remove("hidden");
    arrow.textContent = "▼";
    status.textContent = "Click to collapse";
  } else {
    panel.classList.add("hidden");
    arrow.textContent = "▶";
    status.textContent = "Click to open";
  }
}

    alert("Please enter a claim and click 'Run AI triage' first.");

  const triagePanel = document.getElementById("triagePanel");
  if (triagePanel.classList.contains("hidden")) {
    toggleTriagePanel();
  }

  // Display the actual calculated results
  document.getElementById("triageEmpty").style.display = "none";
  document.getElementById("triageResult").classList.add("visible");

// Loads real world claims directly into the main textarea without displaying the result outright
function loadRealWorldClaim() {
  const selected = realWorldClaims[realWorldIndex];
  
  // Advance to next index for subsequent clicks
  realWorldIndex = (realWorldIndex + 1) % realWorldClaims.length;

  loadClaimIntoForm(selected);
}

function loadClaimIntoForm(item) {
  document.getElementById("submission").value = item.claim;
  document.getElementById("sourceType").value = "Fact-checking submission";
  document.getElementById("priorityLens").value = "Conflicting information";

  const existing = sessionClaims.find(item2 => item2.id === item.id);
  if (!existing) {
    sessionClaims.push({
      id: item.id,
      page: item.claim,
      editor: item.source,
      change: item.reference,
      category: item.category,
      priority: item.priority
    });
  }

  updateStats();
  renderTable();
  runTriage();
}


/* =========================================================
   TRIAGE LOGIC
   ========================================================= */

function isBroadTenureClaim(text) {
  const t = text.toLowerCase();
  return (
    (t.includes("every political office") || t.includes("all political office") || t.includes("every politician")) &&
    (t.includes("four-year") || t.includes("4-year") || t.includes("two terms") || t.includes("2 terms"))
  );
}

function runTriage() {
  const text = document.getElementById("submission").value.trim();
  const sourceType = document.getElementById("sourceType").value;
  const priorityLens = document.getElementById("priorityLens").value;

  if (!text) {
    alert("Please enter a claim or revision description to triage.");
    return;
  }

  const matchedRealWorld = realWorldClaims.find(r => r.claim.toLowerCase() === text.toLowerCase());
  let triageData = {};

  if (matchedRealWorld) {
    triageData = {
      title: matchedRealWorld.claim,
      badge: matchedRealWorld.priority,
      action: matchedRealWorld.expectedStatus,
      category: matchedRealWorld.category,
      reference: matchedRealWorld.reference,
      source: matchedRealWorld.sourceUrl 
        ? `<a href="${matchedRealWorld.sourceUrl}" target="_blank" class="source-link">${matchedRealWorld.source}</a>`
        : matchedRealWorld.source,
      recommendation: matchedRealWorld.recommendation,
      rawItem: matchedRealWorld
    };
  } else if (isBroadTenureClaim(text)) {
    triageData = {
      title: text,
      badge: "Review recommended",
      action: "Requires qualification and human verification",
      category: "Real-world claim / constitutional tenure",
      reference: "Constitutional tenure provisions apply to particular offices. Generalizations are often inaccurate.",
      source: "Constitution of the Federal Republic of Nigeria",
      recommendation: "Verify against specific constitutional sections (135, 137, 180, 182) for the office in question.",
      rawItem: { id: "GEN-" + Date.now(), claim: text, category: "Real-world claim", priority: "Review recommended" }
    };
  } else {
    const isRevert = text.toLowerCase().includes("revert");
    const isLarge = priorityLens === "Large change" || text.length > 100;

    triageData = {
      title: text,
      badge: isRevert || isLarge ? "Review recommended" : "Low",
      action: isRevert ? "Verify revert reason" : (isLarge ? "Inspect diff" : "Routine triage"),
      category: sourceType,
      reference: "Submitted via user intake interface.",
      source: sourceType,
      recommendation: "Examine primary sources and verify supporting diffs or official statements before final determination.",
      rawItem: { id: "GEN-" + Date.now(), claim: text, category: sourceType, priority: isRevert || isLarge ? "Review recommended" : "Low" }
    };
  }

  currentTriage = triageData;

  // Render values internally without displaying immediately
  document.getElementById("resultTitle").textContent = triageData.title;

  const badgeClass = triageData.badge === "Low" ? "badge-low" : "badge-review";
  document.getElementById("resultBadges").innerHTML = `<span class="badge ${badgeClass}">${triageData.badge}</span>`;

  document.getElementById("resultAction").textContent = triageData.action;
  document.getElementById("resultCategory").textContent = triageData.category;
  document.getElementById("resultReference").textContent = triageData.reference;
  document.getElementById("resultSource").innerHTML = triageData.source;
  document.getElementById("resultRecommendation").textContent = triageData.recommendation;
}


/* =========================================================
   QUEUE & TABLE RENDERING
   ========================================================= */

function sendCurrentToVerification() {
  if (!currentTriage) return;

  const item = currentTriage.rawItem;
  const existing = sessionClaims.find(r => r.id === item.id);

  if (!existing) {
    sessionClaims.push({
      id: item.id || "OV-" + (records.length + sessionClaims.length + 1),
      page: item.claim || currentTriage.title,
      editor: item.source || "User Submission",
      change: currentTriage.reference,
      category: currentTriage.category,
      priority: currentTriage.badge
    });
  }

  updateStats();
  renderTable();

  // Open Step 3 queue panel when manually adding an item from Step 2
  const queuePanel = document.getElementById("queuePanel");
  if (queuePanel.classList.contains("hidden")) {
    toggleQueuePanel();
  }

  selectForReview(item.id || sessionClaims[sessionClaims.length - 1].id);
}

function renderTable() {
  const tbody = document.getElementById("queueBody");
  const filter = document.getElementById("queueFilter").value;
  const search = document.getElementById("queueSearch").value.toLowerCase();

  const all = [...records, ...sessionClaims];

  const filtered = all.filter(r => {
    const matchesFilter =
      filter === "All" ||
      (filter === "Review recommended" && r.priority === "Review recommended") ||
      (filter === "Low priority" && r.priority === "Low") ||
      (filter === "Explicit revert" && (r.category.includes("revert") || r.category.includes("Revert")));

    const matchesSearch =
      r.page.toLowerCase().includes(search) ||
      r.editor.toLowerCase().includes(search) ||
      r.category.toLowerCase().includes(search) ||
      r.id.toLowerCase().includes(search);

    return matchesFilter && matchesSearch;
  });

  tbody.innerHTML = filtered.map(r => {
    let badgeClass = "badge-review";
    if (r.priority === "Low") badgeClass = "badge-low";
    if (r.category.toLowerCase().includes("revert")) badgeClass = "badge-revert";

    return `
      <tr>
        <td><strong>${r.id}</strong></td>
        <td>${r.page}</td>
        <td>${r.editor}</td>
        <td>${r.change}</td>
        <td>${r.category}</td>
        <td><span class="badge ${badgeClass}">${r.priority}</span></td>
        <td>
          <button class="secondary small-button" onclick="selectForReview('${r.id}')">
            Verify
          </button>
        </td>
      </tr>
    `;
  }).join("");
}


/* =========================================================
   STEP 4 - VERIFICATION HANDLERS
   ========================================================= */

function selectForReview(id) {
  const all = [...records, ...sessionClaims];
  const found = all.find(r => r.id === id);

  if (!found) return;

  document.getElementById("verificationEmpty").style.display = "none";
  document.getElementById("verificationForm").classList.remove("hidden");

  document.getElementById("reviewId").value = found.id;
  document.getElementById("reviewClaim").innerHTML = `
    <strong>ID:</strong> ${found.id}<br>
    <strong>Item/Claim:</strong> ${found.page}<br>
    <strong>Source/Editor:</strong> ${found.editor}
  `;

  document.getElementById("reviewNotes").value = "";
  document.getElementById("evidenceChecked").value = "";
}

function saveVerification() {
  const id = document.getElementById("reviewId").value;
  const decision = document.getElementById("reviewDecision").value;
  const evidence = document.getElementById("evidenceChecked").value;
  const notes = document.getElementById("reviewNotes").value;

  if (!evidence) {
    alert("Please state the evidence checked.");
    return;
  }

  verificationRecords.push({
    id,
    decision,
    evidence,
    notes,
    timestamp: new Date().toISOString()
  });

  alert(`Verification saved for ${id} as [${decision}].`);
  cancelVerification();
}

function cancelVerification() {
  document.getElementById("verificationForm").classList.add("hidden");
  document.getElementById("verificationEmpty").style.display = "block";
}
